name: Release

# Push a tag like v0.0.1 to build unsigned Windows and macOS installers
# and attach them to a draft pre-release. Code signing is added in March.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Installers are named after the app version, not the tag: the v0.0.2 release
  # shipped mdgloss_0.1.0 files. Fail before the slow builds start.
  check-version:
    name: Check tag matches app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for file in package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; do
            v=$(node -p "require('fs').readFileSync('$file', 'utf8').match(/\"?version\"?\s*[:=]\s*\"([^\"]+)\"/)[1]")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but $file says '$v'"; exit 1; }
          done

  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: mdgloss ${{ github.ref_name }}
          releaseBody: |
            Unsigned pre-alpha build for testing. Windows SmartScreen and macOS Gatekeeper will warn before opening it.
            macOS: right-click the app, choose Open, then Open again.
            Windows: More info, then Run anyway.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
